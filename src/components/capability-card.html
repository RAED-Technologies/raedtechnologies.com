<article class="card cap-card" data-reveal>
  <div class="cap-card__top">
    <span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#i-{{icon}}"/></svg></span>
    <span class="card__num">{{index}}</span>
  </div>
  <h3>{{title}}</h3>
  <ul class="cap-card__items">{{list:items}}</ul>
</article>
