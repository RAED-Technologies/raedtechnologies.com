<section class="section section--dark cta-band" aria-labelledby="cta-band-title">
  <div class="container cta-band__inner" data-reveal>
    <p class="eyebrow">Start a project</p>
    <h2 id="cta-band-title">Let's Build Something Meaningful.</h2>
    <p class="lead">Have an idea, a business challenge, or a process that could work better with technology? Tell us about it.</p>
    <div class="btn-row cta-band__actions">
      <a class="btn btn--primary" href="/contact/">Start a Conversation <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
      <a class="btn btn--ghost" href="mailto:{{site.emailDev}}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg> {{site.emailDev}}</a>
    </div>
  </div>
</section>
