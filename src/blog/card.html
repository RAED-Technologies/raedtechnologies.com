      <li data-reveal data-cat="{{category}}"><a class="bl-card" href="{{url}}">
        <span class="bl-card__media"><img src="/blog/covers/{{slug}}.svg" alt="" width="1200" height="675" loading="lazy" decoding="async"></span>
        <span class="bl-card__body">
        <p class="bl-meta"><span class="bl-tag">{{category}}</span><span>{{readTime}}</span></p>

        <p class="bl-card__excerpt">{{excerpt}}</p>
        <span class="bl-more">Read article <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
