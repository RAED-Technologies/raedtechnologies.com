    <a class="bl-feature" href="{{url}}" data-reveal>
      <div class="bl-feature__art"><img src="/blog/covers/{{slug}}.svg" alt="" width="1200" height="675" decoding="async"></div>
      <div class="bl-feature__body">
        <p class="bl-meta"><span class="bl-tag">Featured</span><span>{{category}}</span><span aria-hidden="true">·</span><span>{{readTime}}</span></p>
        <h2 class="bl-feature__title">{{title}}</h2>
        <p class="bl-feature__excerpt">{{excerpt}}</p>
        <span class="bl-more">Read article <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
      </div>
    </a>
