<a class="card svc-card" href="/services/#{{id}}" data-reveal>
  <span class="svc-card__top">
    <span class="icon-box"><svg class="icon" aria-hidden="true"><use href="#i-{{icon}}"/></svg></span>
    <span class="card__num">{{index}}</span>
  </span>
  <h3>{{title}}</h3>
  <p>{{short}}</p>
  <span class="svc-card__go" aria-hidden="true"><svg class="icon"><use href="#i-arrow-up-right"/></svg></span>
</a>
