  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"RAED Technologies","url":"{{site.url}}","email":"{{site.emailInfo}}","telephone":"{{site.phone}}","logo":"{{site.url}}/logo.png","foundingDate":"2025","address":{"@type":"PostalAddress","addressLocality":"{{site.city}}","addressCountry":"{{site.countryCode}}"},"sameAs":["https://www.linkedin.com/company/raed-technologies/","https://x.com/RAEDTechnologie","https://www.facebook.com/raedtechnologie"]}</script>
  <style id="splash-css">
    .splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0B0D12;color:#F4F5F7;transition:opacity .5s cubic-bezier(.2,.7,.2,1),visibility .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
    .splash::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 45% 45% at 50% 50%,#000,transparent 75%);mask-image:radial-gradient(ellipse 45% 45% at 50% 50%,#000,transparent 75%)}
    .splash::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(47,107,255,.22),transparent);pointer-events:none}
    .splash__in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px}
    .splash__mark{width:72px;height:72px;filter:drop-shadow(0 10px 30px rgba(47,107,255,.25))}
    .splash__tile{transform-origin:50% 50%;animation:splash-tile .6s cubic-bezier(.2,.7,.2,1) both}
    .splash__r{stroke-dasharray:44;stroke-dashoffset:44;animation:splash-draw .8s cubic-bezier(.65,0,.35,1) .25s forwards}
    .splash__dot{transform-origin:22.5px 10px;transform:scale(0);animation:splash-dot .45s cubic-bezier(.34,1.56,.64,1) .95s forwards}
    .splash__name{font:600 15px/1 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em;opacity:0;transform:translateY(6px);animation:splash-up .5s ease .7s forwards}
    .splash__name span{font-weight:500;color:#A9B0BC}
    .splash__bar{position:relative;width:120px;height:2px;overflow:hidden;border-radius:2px;background:rgba(255,255,255,.1);opacity:0;animation:splash-fade .3s ease .8s forwards}
    .splash__bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:inherit;background:#2F6BFF;animation:splash-run 1.1s cubic-bezier(.65,0,.35,1) infinite}
    .splash.is-done{opacity:0;visibility:hidden;transform:scale(1.02)}
    .splash{animation:splash-failsafe .5s ease 4s forwards}
    .no-splash .splash{display:none}
    @keyframes splash-tile{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
    @keyframes splash-draw{to{stroke-dashoffset:0}}
    @keyframes splash-dot{to{transform:scale(1)}}
    @keyframes splash-up{to{opacity:1;transform:none}}
    @keyframes splash-fade{to{opacity:1}}
    @keyframes splash-run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @keyframes splash-failsafe{to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:reduce){.splash *,.splash *::after{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.splash{transition:opacity .2s}}
  </style>
  <style id="nav-css">
    html{background:#0B0D12}
    @view-transition{navigation:auto}
    ::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
    .site-header{view-transition-name:site-header}
    @media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
  </style>
  <script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/*\\?*"}},{"not":{"selector_matches":"[target=_blank],[download]"}}]},"eagerness":"moderate"}]}</script>
  <noscript><style>.splash{display:none}</style></noscript>
  <script>try{if(sessionStorage.getItem('raed-splash'))document.documentElement.classList.add('no-splash');else sessionStorage.setItem('raed-splash','1')}catch(e){}</script>
</head>
<body class="page-{{nav}}">
  <div class="splash" id="splash" role="status" aria-label="Loading RAED Technologies">
    <div class="splash__in">
      <svg class="splash__mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="splash__tile" width="32" height="32" rx="7" fill="#FFFFFF"/><path class="splash__r" d="M10 23V9h6.2a4.3 4.3 0 0 1 1.3 8.4L21.5 23" fill="none" stroke="#0B0D12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle class="splash__dot" cx="22.5" cy="10" r="2" fill="#2F6BFF"/></svg>
      <p class="splash__name">RAED <span>Technologies</span></p>
      <span class="splash__bar" aria-hidden="true"></span>
    </div>
  </div>
  <script>(function(){var s=document.getElementById('splash');if(!s)return;if(document.documentElement.classList.contains('no-splash')){s.remove();return}var t0=Date.now(),gone=false;document.documentElement.style.overflow='hidden';function done(){if(gone)return;gone=true;setTimeout(function(){s.classList.add('is-done');document.documentElement.style.overflow='';setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},600)},Math.max(0,1400-(Date.now()-t0)))}if(document.readyState==='complete')done();else window.addEventListener('load',done);setTimeout(done,3000)})();</script>
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- @include partials/icons.svg -->
  <!-- @include partials/header.html -->
  <main id="main">
{{content}}
  </main>

  <script src="/assets/site.js?v={{version}}" defer></script>
</body>
</html>
