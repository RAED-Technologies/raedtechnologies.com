<article class="pf-case" id="{{id}}" aria-labelledby="{{id}}-title">
  <a class="pf-case__media" href="{{url}}" target="_blank" rel="noopener" data-reveal aria-label="Open {{name}} live site">
    <span class="pf-case__bar" aria-hidden="true"><span></span><span></span><span></span></span>
    <img src="{{image}}" alt="{{imageAlt}}" width="1440" height="900" loading="lazy" decoding="async">
  </a>
  <div class="pf-case__body" data-reveal>
    <p class="pf-case__meta"><span class="bl-tag">{{industry}}</span><span>{{index}}</span></p>
    <h2 class="pf-case__title" id="{{id}}-title">{{title}}</h2>
    <p class="pf-case__summary">{{summary}}</p>
    <h3 class="pf-case__label">What we built</h3>
    <ul class="pf-case__points">{{list:highlights}}</ul>
    <h3 class="pf-case__label">Technology</h3>
    <ul class="pf-case__stack">{{list:stack}}</ul>
    <a class="btn btn--primary btn--sm pf-case__cta" href="{{url}}" target="_blank" rel="noopener">Visit live site <svg class="icon" aria-hidden="true"><use href="#i-arrow-up-right"/></svg></a>
  </div>
</article>
